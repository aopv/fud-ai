services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fud_ai_sync
      POSTGRES_USER: fud_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - fud-ai-postgres:/var/lib/postgresql/data
      - ../../adapters/postgres/migrations/0001_init.sql:/docker-entrypoint-initdb.d/0001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fud_ai -d fud_ai_sync"]
      interval: 5s
      timeout: 5s
      retries: 10

  sync:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://fud_ai:${POSTGRES_PASSWORD}@postgres:5432/fud_ai_sync
      SYNC_TOKEN: ${SYNC_TOKEN:?Set a random SYNC_TOKEN of at least 32 characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      PGPOOL_MAX: ${PGPOOL_MAX:-10}
    ports:
      - "${SYNC_PORT:-8787}:8787"

volumes:
  fud-ai-postgres:
