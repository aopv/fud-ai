name = "fud-ai"
main = "worker.ts"
compatibility_date = "2026-07-10"
workers_dev = false
preview_urls = false

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/star-history.svg", "/star-history.json"]

[[kv_namespaces]]
binding = "STAR_HISTORY"
id = "3576eb63eadf40f2b7f55afb75e3cd85"

[triggers]
crons = ["17 * * * *"]

[[routes]]
pattern = "fud-ai.app"
custom_domain = true

[[routes]]
pattern = "www.fud-ai.app"
custom_domain = true
